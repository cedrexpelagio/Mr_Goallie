<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Goal — Mr Goallie</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo" aria-label="Mr Goallie Home">
        Mr <span class="brand-gradient">Goallie</span>
      </a>

      <div class="nav-right">
        <nav aria-label="Primary Navigation">
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Goals</a></li>
            <li><a href="index.html#activity-section" class="nav-link">Activity</a></li>
            <li><a href="index.html#calendar-section" class="nav-link">Performance</a></li>
          </ul>
        </nav>
        <a href="#profile" class="profile-btn" aria-label="User Profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main class="form-page-layout">

    <div class="form-card">
      <div class="form-header">
        <span class="section-tag">Planning &amp; Execution</span>
        <h1 class="section-title">Create New Goal</h1>
        <p style="color: var(--color-text-muted); font-size: var(--text-sm); margin-top: 4px;">
          Define your overarching objective, break it into missions, and schedule concrete actions.
        </p>
      </div>
<!-- action="index.html" method="get" -->
      <form class="form-section">
        
        <!-- 1. Goal Details Section -->
        <fieldset class="form-section" style="border: none;">
          <legend class="section-tag" style="margin-bottom: var(--space-2);">1. Goal Details</legend>

          <div class="form-group">
            <label for="goal-title" class="form-label">Goal Title</label>
            <input 
              type="text" 
              id="goal-title" 
              name="goal_title" 
              class="form-input" 
              placeholder="e.g. Earn ₱10K This Month" 
              required
            >
          </div>

          <div class="form-group-row">
            <div class="form-group">
              <label for="goal-category" class="form-label">Category</label>
              <select id="goal-category" name="goal_category" class="form-select" required>
                <option value="" disabled selected>Select category...</option>
                <option value="health">Health</option>
                <option value="career">Career</option>
                <option value="finance">Finance</option>
                <option value="learning">Learning</option>
                <option value="personal">Personal</option>
              </select>
            </div>

            <div class="form-group">
              <label for="goal-deadline" class="form-label">Deadline</label>
              <input 
                type="date" 
                id="goal-deadline" 
                name="goal_deadline" 
                class="form-input" 
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="goal-description" class="form-label">
              Description <span class="form-label-optional">(Optional)</span>
            </label>
            <textarea 
              id="goal-description" 
              name="goal_description" 
              class="form-textarea" 
              rows="3" 
              placeholder="What does success look like? Any key milestones or motivation?"
            ></textarea>
          </div>

          <!-- 2. Nested Mission Details Section -->

        </fieldset>

        <!-- Form Footer: Cancel & Save Goal -->
        <div class="form-actions-footer">
          <a href="index.html" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-submit">Save Goal</button>
        </div>

      </form>
    </div>

  </main>

  <!-- Consistent Site Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand-col">
        <a href="index.html" class="brand-logo" aria-label="Mr Goallie Home">
          Mr <span class="brand-gradient">Goallie</span>
        </a>
        <p class="footer-tagline">Track small actions. Compound massive goals.</p>
      </div>

      <div class="footer-meta-col">
        <a href="https://github.com" class="footer-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
          <span>GitHub</span>
        </a>
        <span class="footer-copyright">&copy; 2026 Mr Goallie</span>
      </div>
    </div>
  </footer>

   <script type="module" src="./javascript/goalForm.js"></script>

</body>
</html>
